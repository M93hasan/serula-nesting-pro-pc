name: Serula PC Windows build and release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/pc-windows-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Windows bridge PowerShell syntax
        shell: powershell
        run: |
          $targets = @("desktop/bridge/SerulaTransferBridge.ps1", "desktop/bridge/SetupBundledBridge.ps1")
          foreach ($path in $targets) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $_" }
              exit 1
            }
          }
          $scriptText = Get-Content "desktop/bridge/SerulaTransferBridge.ps1" -Raw
          if ($scriptText -notmatch "version='1.4'" -or $scriptText -notmatch "Open-RDWorksImportPicker" -or $scriptText -notmatch "Try-RDWorksClassicPicker") {
            throw "Bridge version or RDWorks fallback missing."
          }
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: serula-nesting-pro-pc-setup
          path: release/Serula-Nesting-Pro-PC-Setup.exe
          if-no-files-found: error
      - name: Resolve PC version
        id: meta
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish versioned PC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ steps.meta.outputs.version }}
          name: Serula Nesting Pro PC v${{ steps.meta.outputs.version }}
          body: |
            Serula Bridge 1.4 — RDWorks File > Import, Ctrl+I and Windows dialog fallbacks.
            Source DXF geometry and nesting engine remain unchanged.
            Verify imported drawing, dimensions and cutting layers before using the laser.
          files: release/Serula-Nesting-Pro-PC-Setup.exe
          fail_on_unmatched_files: true
