name: Check upstream Serula

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PC repo
        uses: actions/checkout@v4

      - name: Read upstream version
        id: upstream
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/M93hasan/nesting.git refs/heads/main | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update upstream marker
        shell: bash
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > UPSTREAM_COMMIT
          {
            echo "# Upstream Serula"
            echo
            echo "Source: https://github.com/M93hasan/nesting"
            echo
            echo "Latest main commit: `${{ steps.upstream.outputs.sha }}`"
            echo
            echo "The desktop app loads https://serula.site, so published web changes are visible automatically."
          } > UPSTREAM.md

      - name: Commit marker when changed
        shell: bash
        run: |
          if git diff --quiet -- UPSTREAM_COMMIT UPSTREAM.md; then
            echo "No upstream change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM_COMMIT UPSTREAM.md
          git commit -m "chore: track latest nesting upstream"
          git push
