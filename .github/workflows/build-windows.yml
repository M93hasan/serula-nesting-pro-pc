name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: serula-nesting-pro-pc-windows
          path: release/Serula-Nesting-Pro-PC-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v0.1.0
          name: Serula Nesting Pro PC v0.1.0
          body: |
            Serula Nesting Pro PC Windows x64 installer.
            Ana Serula uygulamasının canlı sürümünü masaüstü penceresinde açar.
          make_latest: true
          overwrite_files: true
          files: release/Serula-Nesting-Pro-PC-Setup.exe
