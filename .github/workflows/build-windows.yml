name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify bundled bridge scripts (PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($file in @('desktop/bridge/SerulaTransferBridge.ps1', 'desktop/bridge/SetupBundledBridge.ps1')) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell syntax error in $file : $($parseErrors | Out-String)" }
          }
          if (-not (Test-Path 'desktop/bridge/Serula-Kur.cmd')) { throw 'Bundled installer command missing' }

      - name: Validate Electron main process
        run: node --check desktop/main.cjs

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: serula-nesting-pro-pc-windows
          path: release/Serula-Nesting-Pro-PC-Setup.exe
          if-no-files-found: error

      # Releases are published only by pc-windows-release.yml so an older
      # installer cannot overwrite the current latest version.
